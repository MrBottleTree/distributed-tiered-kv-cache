# ============================================================
# LMCache config for Machine A — gRPC plugin → Machine B
# ============================================================
# Machine B must be running before starting Machine A.
# ============================================================

storage_plugins:
  - grpc

extra_config:
  storage_plugin.grpc.module_path: lmcache.v1.storage_backend.grpc_backend
  storage_plugin.grpc.class_name: GRPCBackend

  # Machine B address — update to the actual IP when running on separate hosts.
  # gRPC lives on port 50051 on Machine B; port 8080 there is the dashboard,
  # not the gRPC server — do not point this at 8080.
  grpc_server: "172.31.12.251:50051"

  grpc_quality_score: 1.0

  # Maximum gRPC message size in bytes (must match machine_b/config/config.yaml).
  grpc_max_message_bytes: 536870912  # 512 MB

save_unfull_chunk: true

enable_pd: false

# LocalCPUBackend is required as a staging allocator for tensors received from
# Machine B via gRPC. Even though all persistent storage is on Machine B,
# LMCache needs this buffer to reconstruct MemoryObj on retrieval.
# 2 GB is sufficient for staging; it does NOT act as a local KV cache tier.
local_cpu: true
max_local_cpu_size: 2
