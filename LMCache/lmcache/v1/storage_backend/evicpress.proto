syntax = "proto3";

package evicpress;

// EvicPressService is Machine B's gRPC interface.
// Machine A calls these to store, retrieve, prefetch, and inspect KV cache blocks.
//
// Tiering is INCLUSIVE: Machine B's disk (T3) always holds a canonical copy of
// every block. T1 (Machine A RAM) and T2 (Machine B RAM) are pure cache copies.
// Evicting from T1/T2 is a drop — data is never lost until T3 evicts.
service EvicPressService {
  // Lookup: check if a block exists and which tier it's in. O(1).
  rpc Lookup (LookupRequest) returns (LookupResponse);

  // Store: save a KV block from Machine A. Machine B decides placement.
  rpc Store (StoreRequest) returns (StoreResponse);

  // Retrieve: fetch a KV block's data. Promotes tier3->tier2 opportunistically.
  rpc Retrieve (RetrieveRequest) returns (RetrieveResponse);

  // Prefetch: hint Machine B to move blocks to faster tiers proactively.
  rpc Prefetch (PrefetchRequest) returns (PrefetchResponse);

  // Delete: remove a block explicitly (e.g., context invalidated).
  rpc Delete (DeleteRequest) returns (DeleteResponse);

  // GetStats: pull current cache stats for monitoring.
  rpc GetStats (StatsRequest) returns (StatsResponse);

  // Optional head-granularity path. Legacy whole-chunk RPCs stay unchanged.
  rpc StoreHeads (HeadStoreRequest) returns (HeadGroupResponse);
  rpc LookupHeads (HeadReadRequest) returns (HeadBatchResponse);
  rpc RetrieveHeads (HeadReadRequest) returns (HeadBatchResponse);
  rpc DeleteHeads (HeadDeleteRequest) returns (DeleteResponse);
  rpc ReleaseHeads (HeadLeaseRequest) returns (DeleteResponse);
  rpc SyncHeadTier1 (HeadTier1Request) returns (HeadTier1Response);
}

// --- Lookup ---
message LookupRequest {
  string block_id = 1;
}
message LookupResponse {
  bool  hit  = 1;
  int32 tier = 2;  // 0 = miss, 1 = Machine A RAM (ledger), 2 = Machine B RAM, 3 = Disk
}

// --- Store ---
message StoreRequest {
  string block_id      = 1;
  bytes  data          = 2;  // Serialized KV tensor (opaque bytes)
  float  quality_score = 3;  // 0.0–1.0. How sensitive this block is to compression.
}
message StoreResponse {
  bool   success = 1;
  int32  tier    = 2;  // Primary tier cached. 1 = promote to Machine A RAM; 2 = Machine B RAM; 3 = Disk only.
  string message = 3;  // Optional debug message
}

// --- Retrieve ---
message RetrieveRequest {
  string block_id = 1;
}
message RetrieveResponse {
  bool   found = 1;
  bytes  data  = 2;
  int32  tier  = 3;  // Tier from which it was retrieved
}

// --- Prefetch ---
message PrefetchRequest {
  repeated string block_ids = 1;  // Blocks to move to faster tiers
}
message PrefetchResponse {
  int32 queued = 1;  // How many were accepted into the prefetch queue
}

// --- Delete ---
message DeleteRequest {
  string block_id = 1;
}
message DeleteResponse {
  bool success = 1;
}

// --- Stats ---
message StatsRequest {}
message StatsResponse {
  int64 tier2_blocks      = 1;
  int64 tier3_blocks      = 2;
  int64 tier2_bytes       = 3;
  int64 tier3_bytes       = 4;
  int64 total_hits        = 5;
  int64 total_misses      = 6;
  int64 tier2_hits        = 7;
  int64 tier3_hits        = 8;
  float hit_rate          = 9;
  int64 evictions         = 10;
  // Tier 1: Machine B's local ledger of blocks promoted to Machine A RAM.
  int64 tier1_blocks      = 11;
  int64 tier1_bytes       = 12;
  int64 tier1_promotions  = 13;
  int32 head_schema_version = 14;
  int64 parent_hits = 15;
  int64 parent_misses = 16;
  int64 head_rpc_calls = 17;
  int64 head_wire_bytes = 18;
}

// Descriptors contain only portable geometry/identity, never allocator pointers.
message HeadPayload { string block_id = 1; bytes data = 2; }
message HeadStoreRequest {
  string descriptor_json = 1;
  repeated HeadPayload heads = 2;
  string client_id = 3;
}
message HeadStatus {
  string block_id = 1;
  bool found = 2;
  int32 tier = 3;
  string quant_level = 4;
  bytes data = 5;
  bool cache_in_tier1 = 6;
}
message HeadGroupResponse {
  string parent_id = 1;
  bool found = 2;
  string descriptor_json = 3;
  repeated HeadStatus heads = 4;
  string lease_id = 5;
  string message = 6;
}
message HeadReadItem {
  string parent_id = 1;
  repeated string local_ids = 2;
  string lease_id = 3;
}
message HeadReadRequest {
  repeated HeadReadItem parents = 1;
  string client_id = 2;
  bool pin = 3;
}
message HeadBatchResponse { repeated HeadGroupResponse parents = 1; }
message HeadDeleteRequest {
  repeated string parent_ids = 1;
  bool force = 2;
}
message HeadLeaseRequest { repeated string lease_ids = 1; string client_id = 2; }
message HeadTier1Entry { string block_id = 1; int64 nbytes = 2; }
message HeadTier1Request { string client_id = 1; repeated HeadTier1Entry entries = 2; }
message HeadTier1Response { repeated string revoked_ids = 1; }
